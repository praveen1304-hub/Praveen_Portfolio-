<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="50%" stop-color="#1A0D15"/>
      <stop offset="100%" stop-color="#08111F"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg3)"/>

  <!-- ECG Pulse Wave in Background -->
  <path d="M 0 240 L 180 240 L 210 200 L 230 290 L 250 170 L 270 270 L 290 240 L 800 240" stroke="#EF4444" stroke-width="2" fill="none" opacity="0.35"/>

  <!-- Top Dashboard Bar -->
  <rect x="50" y="50" width="700" height="45" rx="10" fill="#0E1628" stroke="#1E3A5F" stroke-width="1.5"/>
  <circle cx="75" cy="72" r="10" fill="#DC2626" filter="url(#glow3)"/>
  <text x="95" y="77" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="14" font-weight="bold">CAMPUS BLOOD DONOR NETWORK</text>
  
  <rect x="580" y="60" width="155" height="26" rx="6" fill="#1C1917" stroke="#EF4444" stroke-width="1"/>
  <text x="657" y="77" fill="#FCA5A5" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">● EMERGENCY MODE: ON</text>

  <!-- Blood Group Pills Filter -->
  <g transform="translate(50, 115)">
    <rect x="0" y="0" width="70" height="32" rx="8" fill="url(#redGlow)" filter="url(#glow3)"/>
    <text x="35" y="21" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">O +ve</text>

    <rect x="85" y="0" width="70" height="32" rx="8" fill="#0F172A" stroke="#1E3A5F" stroke-width="1"/>
    <text x="120" y="21" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">A +ve</text>

    <rect x="170" y="0" width="70" height="32" rx="8" fill="#0F172A" stroke="#1E3A5F" stroke-width="1"/>
    <text x="205" y="21" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">B +ve</text>

    <rect x="255" y="0" width="70" height="32" rx="8" fill="#0F172A" stroke="#1E3A5F" stroke-width="1"/>
    <text x="290" y="21" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">AB +ve</text>

    <rect x="340" y="0" width="70" height="32" rx="8" fill="#0F172A" stroke="#1E3A5F" stroke-width="1"/>
    <text x="375" y="21" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">O -ve</text>

    <rect x="425" y="0" width="70" height="32" rx="8" fill="#0F172A" stroke="#1E3A5F" stroke-width="1"/>
    <text x="460" y="21" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">A -ve</text>

    <rect x="510" y="0" width="190" height="32" rx="8" fill="#091424" stroke="#2563EB" stroke-width="1"/>
    <text x="605" y="21" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">🔍 Search Department...</text>
  </g>

  <!-- Donor Profile Card 1 -->
  <rect x="50" y="165" width="335" height="170" rx="14" fill="#0E1A2E" stroke="#2563EB" stroke-width="1.5" filter="url(#glow3)"/>
  <circle cx="95" cy="205" r="24" fill="#1E293B"/>
  <text x="95" y="212" fill="#38BDF8" font-family="Inter, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">P</text>
  
  <text x="135" y="200" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="15" font-weight="bold">Verified Student Donor</text>
  <text x="135" y="218" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">Dept: AI &amp; DS | Year: IV</text>

  <rect x="290" y="180" width="75" height="26" rx="6" fill="#1E1B4B" stroke="#7C3AED" stroke-width="1"/>
  <text x="327" y="197" fill="#C084FC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">O +ve</text>

  <line x1="75" y1="245" x2="360" y2="245" stroke="#1E3A5F" stroke-width="1"/>

  <text x="75" y="270" fill="#22C55E" font-family="'JetBrains Mono', monospace" font-size="10">● Status: Available for Call</text>
  
  <rect x="75" y="285" width="135" height="34" rx="8" fill="url(#redGlow)"/>
  <text x="142" y="306" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">📞 Instant Contact</text>

  <rect x="225" y="285" width="135" height="34" rx="8" fill="#0B1324" stroke="#1E3A5F" stroke-width="1"/>
  <text x="292" y="306" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">💬 Direct SMS</text>

  <!-- Donor Profile Card 2 -->
  <rect x="415" y="165" width="335" height="170" rx="14" fill="#0A1424" stroke="#1E3A5F" stroke-width="1.5"/>
  <circle cx="460" cy="205" r="24" fill="#1E293B"/>
  <text x="460" y="212" fill="#60A5FA" font-family="Inter, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">S</text>
  
  <text x="500" y="200" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="15" font-weight="bold">Faculty Donor #204</text>
  <text x="500" y="218" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">Dept: CSE | Campus Block B</text>

  <rect x="655" y="180" width="75" height="26" rx="6" fill="#1E1B4B" stroke="#7C3AED" stroke-width="1"/>
  <text x="692" y="197" fill="#C084FC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">O +ve</text>

  <line x1="440" y1="245" x2="725" y2="245" stroke="#1E3A5F" stroke-width="1"/>

  <text x="440" y="270" fill="#22C55E" font-family="'JetBrains Mono', monospace" font-size="10">● Status: Available on Campus</text>
  
  <rect x="440" y="285" width="135" height="34" rx="8" fill="url(#redGlow)"/>
  <text x="507" y="306" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">📞 Instant Contact</text>

  <rect x="590" y="285" width="135" height="34" rx="8" fill="#0B1324" stroke="#1E3A5F" stroke-width="1"/>
  <text x="657" y="306" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">💬 Direct SMS</text>

  <!-- Bottom Architecture Flow -->
  <g transform="translate(50, 365)">
    <rect x="0" y="0" width="120" height="32" rx="8" fill="#0F172A" stroke="#2563EB" stroke-width="1"/>
    <text x="60" y="20" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">React UI</text>
    
    <text x="140" y="20" fill="#64748B" font-size="14">→</text>

    <rect x="160" y="0" width="140" height="32" rx="8" fill="#0F172A" stroke="#06B6D4" stroke-width="1"/>
    <text x="230" y="20" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Express Server</text>

    <text x="320" y="20" fill="#64748B" font-size="14">→</text>

    <rect x="340" y="0" width="130" height="32" rx="8" fill="#0F172A" stroke="#22C55E" stroke-width="1"/>
    <text x="405" y="20" fill="#86EFAC" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Node.js Engine</text>

    <text x="490" y="20" fill="#64748B" font-size="14">→</text>

    <rect x="510" y="0" width="150" height="32" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="585" y="20" fill="#FDE047" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">MySQL Database</text>
  </g>
</svg>
