<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="50%" stop-color="#110C24"/>
      <stop offset="100%" stop-color="#08111F"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg2)"/>

  <!-- Circuit Board Traces -->
  <path d="M 50 100 L 150 100 L 200 150 L 320 150" stroke="#7C3AED" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 80 400 L 180 400 L 240 340 L 380 340" stroke="#06B6D4" stroke-width="2" fill="none" opacity="0.3"/>
  <circle cx="150" cy="100" r="4" fill="#A855F7"/>
  <circle cx="200" cy="150" r="4" fill="#A855F7"/>
  <circle cx="180" cy="400" r="4" fill="#06B6D4"/>

  <!-- Camera Vision Viewport Center -->
  <rect x="360" y="70" width="380" height="260" rx="16" fill="#0B1220" stroke="#7C3AED" stroke-width="2" filter="url(#glow2)"/>
  
  <!-- Camera Grid & Crosshairs -->
  <line x1="380" y1="200" x2="720" y2="200" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="550" y1="90" x2="550" y2="310" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Face Detection Bounding Box -->
  <rect x="490" y="120" width="130" height="150" rx="4" fill="none" stroke="#22C55E" stroke-width="2" filter="url(#glow2)"/>
  <!-- Corner brackets -->
  <path d="M 480 140 L 480 110 L 510 110" stroke="#22C55E" stroke-width="3" fill="none"/>
  <path d="M 600 110 L 630 110 L 630 140" stroke="#22C55E" stroke-width="3" fill="none"/>
  <path d="M 480 250 L 480 280 L 510 280" stroke="#22C55E" stroke-width="3" fill="none"/>
  <path d="M 600 280 L 630 280 L 630 250" stroke="#22C55E" stroke-width="3" fill="none"/>

  <rect x="490" y="95" width="130" height="22" rx="4" fill="#22C55E"/>
  <text x="555" y="110" fill="#050B14" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">TARGET: INFANT 98.4%</text>

  <!-- Live FPS & Sensor HUD -->
  <text x="380" y="100" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="10">CAM01 // 1080p @ 30FPS</text>
  <text x="380" y="120" fill="#A855F7" font-family="'JetBrains Mono', monospace" font-size="10">OPENCV HAAR ENGINE</text>
  <text x="380" y="310" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">⚠ PROXIMITY HAZARD ZONE</text>

  <!-- Left Side Hardware Control Panel -->
  <rect x="60" y="70" width="260" height="260" rx="16" fill="#0E1626" stroke="#1E3A5F" stroke-width="1.5"/>
  <rect x="80" y="90" width="220" height="30" rx="6" fill="#1E1B4B" stroke="#7C3AED" stroke-width="1"/>
  <text x="190" y="110" fill="#C084FC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">RASPBERRY PI CONTROLLER</text>

  <!-- Door Override Status Block -->
  <rect x="80" y="135" width="220" height="75" rx="10" fill="#180D2B" stroke="#EF4444" stroke-width="1.5"/>
  <circle cx="105" cy="160" r="8" fill="#EF4444" filter="url(#glow2)"/>
  <text x="125" y="156" fill="#FCA5A5" font-family="Inter, sans-serif" font-size="12" font-weight="bold">DOOR OVERRIDE: ENGAGED</text>
  <text x="125" y="172" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">Solenoid Relay: HIGH (LOCKED)</text>
  <text x="125" y="195" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="10">Emergency Lockdown Active</text>

  <rect x="80" y="225" width="220" height="85" rx="10" fill="#091322" stroke="#1E3A5F" stroke-width="1"/>
  <text x="95" y="248" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9">INFERENCE LATENCY</text>
  <text x="95" y="265" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">18.4 ms</text>
  <text x="95" y="295" fill="#22C55E" font-family="'JetBrains Mono', monospace" font-size="10">● HARDWARE INTERFACE: OK</text>

  <!-- Bottom Architecture Flow -->
  <g transform="translate(60, 365)">
    <rect x="0" y="0" width="120" height="32" rx="8" fill="#0F172A" stroke="#7C3AED" stroke-width="1"/>
    <text x="60" y="20" fill="#C084FC" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Camera Feed</text>
    
    <text x="135" y="20" fill="#64748B" font-size="14">→</text>

    <rect x="155" y="0" width="140" height="32" rx="8" fill="#0F172A" stroke="#22C55E" stroke-width="1"/>
    <text x="225" y="20" fill="#86EFAC" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Face Detection</text>

    <text x="310" y="20" fill="#64748B" font-size="14">→</text>

    <rect x="330" y="0" width="130" height="32" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="395" y="20" fill="#FDE047" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Risk Logic</text>

    <text x="475" y="20" fill="#64748B" font-size="14">→</text>

    <rect x="495" y="0" width="150" height="32" rx="8" fill="#0F172A" stroke="#EF4444" stroke-width="1"/>
    <text x="570" y="20" fill="#FCA5A5" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Door Override</text>
  </g>
</svg>
