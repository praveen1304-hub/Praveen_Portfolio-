<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="50%" stop-color="#0B1628"/>
      <stop offset="100%" stop-color="#071326"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg)"/>
  
  <!-- Cyber Grid Lines -->
  <g stroke="#1E3A5F" stroke-width="1" opacity="0.3">
    <line x1="0" y1="80" x2="800" y2="800"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- Radar Rings / Geofence -->
  <circle cx="380" cy="240" r="160" stroke="#1E3A5F" stroke-width="1.5" fill="none" opacity="0.4"/>
  <circle cx="380" cy="240" r="110" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6,4" fill="none" opacity="0.6"/>
  <circle cx="380" cy="240" r="60" stroke="#06B6D4" stroke-width="2" fill="none" opacity="0.8" filter="url(#glow)"/>
  <circle cx="380" cy="240" r="10" fill="#3B82F6" filter="url(#glow)"/>

  <!-- Radar Scan Sweep -->
  <path d="M 380 240 L 490 130 A 160 160 0 0 0 380 80 Z" fill="url(#blueGlow)" opacity="0.15"/>

  <!-- Mobile Frame Mockup -->
  <rect x="520" y="80" width="220" height="320" rx="20" fill="#0B1628" stroke="#3B82F6" stroke-width="2" filter="url(#glow)"/>
  <rect x="535" y="105" width="190" height="270" rx="12" fill="#08111F"/>
  <circle cx="630" cy="95" r="4" fill="#64748B"/>
  
  <!-- Mobile Screen Content -->
  <rect x="550" y="125" width="160" height="24" rx="6" fill="#1E293B"/>
  <text x="630" y="141" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">GEO-ATTEND v1.2</text>
  
  <!-- Status Badge inside Phone -->
  <rect x="550" y="165" width="160" height="44" rx="8" fill="#0F2847" stroke="#2563EB" stroke-width="1"/>
  <circle cx="568" cy="187" r="6" fill="#22C55E"/>
  <text x="585" y="183" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Verified in Zone</text>
  <text x="585" y="197" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9">Radius: 28m / 50m</text>

  <!-- Live GPS Data Box -->
  <rect x="550" y="225" width="160" height="60" rx="8" fill="#091424" stroke="#1E3A5F" stroke-width="1"/>
  <text x="560" y="244" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="8">LATITUDE</text>
  <text x="560" y="258" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="10">12.8394° N</text>
  <text x="640" y="244" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="8">LONGITUDE</text>
  <text x="640" y="258" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="10">78.1234° E</text>

  <!-- Check In Button inside Phone -->
  <rect x="550" y="300" width="160" height="32" rx="8" fill="url(#blueGlow)"/>
  <text x="630" y="320" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">✓ Check In Recorded</text>

  <!-- Left Floating Telemetry Box -->
  <rect x="60" y="110" width="220" height="130" rx="14" fill="#0B1628" stroke="#1E3A5F" stroke-width="1.5"/>
  <text x="80" y="140" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">REALTIME GEOFENCING</text>
  <text x="80" y="165" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">Target Perimeter: 50m</text>
  <text x="80" y="185" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">Cloud Sync: Firestore Live</text>
  <text x="80" y="210" fill="#22C55E" font-family="'JetBrains Mono', monospace" font-size="11">● STATUS: ACTIVE SECURE</text>

  <!-- Bottom Architecture Pills -->
  <g transform="translate(60, 360)">
    <rect x="0" y="0" width="95" height="28" rx="6" fill="#0F172A" stroke="#2563EB" stroke-width="1"/>
    <text x="47" y="18" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">React Native</text>
    
    <text x="110" y="18" fill="#64748B" font-size="14">→</text>

    <rect x="125" y="0" width="70" height="28" rx="6" fill="#0F172A" stroke="#06B6D4" stroke-width="1"/>
    <text x="160" y="18" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">GPS Sat</text>

    <text x="210" y="18" fill="#64748B" font-size="14">→</text>

    <rect x="225" y="0" width="80" height="28" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
    <text x="265" y="18" fill="#FBBF24" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Firebase</text>
  </g>
</svg>
