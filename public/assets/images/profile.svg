<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="50%" stop-color="#0E1B31"/>
      <stop offset="100%" stop-color="#08111F"/>
    </linearGradient>
    <linearGradient id="pGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="pBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="30" fill="url(#pBg)"/>

  <!-- Cyber Halo Circles -->
  <circle cx="250" cy="250" r="220" stroke="#1E3A5F" stroke-width="1.5" stroke-dasharray="6,8" fill="none"/>
  <circle cx="250" cy="250" r="180" stroke="url(#pGlow)" stroke-width="2" fill="none" opacity="0.7" filter="url(#pBlur)"/>

  <!-- Developer Silhouette Representation with Neon Lighting -->
  <!-- Shoulders / Body -->
  <path d="M 120 440 C 120 340, 180 300, 250 300 C 320 300, 380 340, 380 440 Z" fill="#0B182B" stroke="#2563EB" stroke-width="2"/>
  
  <!-- Hoodie / Collar Accents -->
  <path d="M 210 305 L 250 365 L 290 305" stroke="#3B82F6" stroke-width="2.5" fill="none"/>

  <!-- Head -->
  <circle cx="250" cy="210" r="75" fill="#0E1E38" stroke="#7C3AED" stroke-width="2" filter="url(#pBlur)"/>
  <path d="M 185 200 C 185 140, 210 135, 250 135 C 290 135, 315 140, 315 200 Z" fill="#081426"/>

  <!-- Holographic Glasses / HUD visor -->
  <rect x="200" y="195" width="100" height="24" rx="12" fill="#050B14" stroke="#06B6D4" stroke-width="2" filter="url(#pBlur)"/>
  <line x1="210" y1="207" x2="290" y2="207" stroke="#38BDF8" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Glowing Code Particles around avatar -->
  <text x="70" y="120" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="12" opacity="0.6">&lt;React /&gt;</text>
  <text x="360" y="140" fill="#FACC15" font-family="'JetBrains Mono', monospace" font-size="12" opacity="0.6">def build():</text>
  <text x="60" y="380" fill="#4ADE80" font-family="'JetBrains Mono', monospace" font-size="12" opacity="0.6">SQL SELECT *</text>
  <text x="360" y="370" fill="#C084FC" font-family="'JetBrains Mono', monospace" font-size="12" opacity="0.6">{ REST_API }</text>

  <!-- Bottom Tag -->
  <rect x="150" y="440" width="200" height="34" rx="8" fill="#091424" stroke="#2563EB" stroke-width="1.5"/>
  <text x="250" y="462" fill="#F8FAFC" font-family="Inter, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">PRAVEEN R</text>
</svg>
