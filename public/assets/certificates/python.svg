<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08111F"/>
      <stop offset="50%" stop-color="#0E1B31"/>
      <stop offset="100%" stop-color="#050B14"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="certShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="540" fill="url(#certBg)"/>

  <!-- Outer Glass Frame -->
  <rect x="25" y="25" width="750" height="490" rx="16" fill="#0B1628" stroke="#1E3A5F" stroke-width="2" filter="url(#certShadow)"/>
  
  <!-- Inner Border with Decorative Corners -->
  <rect x="45" y="45" width="710" height="450" rx="10" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Corner Tech Accent Brackets -->
  <path d="M 45 75 L 45 45 L 75 45" stroke="#38BDF8" stroke-width="3" fill="none"/>
  <path d="M 725 45 L 755 45 L 755 75" stroke="#38BDF8" stroke-width="3" fill="none"/>
  <path d="M 45 465 L 45 495 L 75 495" stroke="#38BDF8" stroke-width="3" fill="none"/>
  <path d="M 725 495 L 755 495 L 755 465" stroke="#38BDF8" stroke-width="3" fill="none"/>

  <!-- Top Cyber Badge -->
  <rect x="300" y="32" width="200" height="26" rx="13" fill="#0F172A" stroke="#EAB308" stroke-width="1"/>
  <text x="400" y="49" fill="#FDE047" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">★ VERIFIED CREDENTIAL ★</text>

  <!-- Issuer Header -->
  <text x="400" y="105" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" letter-spacing="3" text-anchor="middle">CYBERNAUT ED TECH PRIVATE LIMITED</text>
  
  <text x="400" y="145" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12" letter-spacing="4" text-anchor="middle">CERTIFICATE OF PROFICIENCY</text>
  
  <text x="400" y="180" fill="#64748B" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">THIS IS PROUDLY PRESENTED TO</text>
  
  <!-- Candidate Name -->
  <text x="400" y="235" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="34" font-weight="900" letter-spacing="1" text-anchor="middle">PRAVEEN R</text>
  <line x1="260" y1="255" x2="540" y2="255" stroke="url(#goldGlow)" stroke-width="2"/>

  <!-- Subject / Description -->
  <text x="400" y="290" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="15" text-anchor="middle">For demonstrating comprehensive proficiency in</text>
  
  <text x="400" y="330" fill="url(#goldGlow)" font-family="Inter, sans-serif" font-size="24" font-weight="800" text-anchor="middle">PYTHON PROGRAMMING &amp; APPLICATIONS</text>
  
  <text x="400" y="365" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">Covering Core Paradigms, Data Structures, Automation, and Scripting</text>

  <!-- Bottom Seals & Signatures -->
  <g transform="translate(100, 400)">
    <!-- Left Seal: Verified Code -->
    <rect x="0" y="0" width="180" height="55" rx="8" fill="#08111F" stroke="#1E3A5F" stroke-width="1"/>
    <text x="90" y="24" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">CREDENTIAL ID</text>
    <text x="90" y="42" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">CYBERNAUT-PY-2026</text>
  </g>

  <!-- Center Gold Ribbon Badge -->
  <g transform="translate(365, 395)">
    <circle cx="35" cy="35" r="32" fill="#0B1628" stroke="url(#goldGlow)" stroke-width="2"/>
    <circle cx="35" cy="35" r="26" fill="#17150A" stroke="#EAB308" stroke-width="1"/>
    <text x="35" y="41" fill="#FDE047" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" text-anchor="middle">✓</text>
  </g>

  <g transform="translate(520, 400)">
    <!-- Right Seal: Domain -->
    <rect x="0" y="0" width="180" height="55" rx="8" fill="#08111F" stroke="#1E3A5F" stroke-width="1"/>
    <text x="90" y="24" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">VERIFICATION</text>
    <text x="90" y="42" fill="#22C55E" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">● SECURE &amp; VERIFIED</text>
  </g>
</svg>
