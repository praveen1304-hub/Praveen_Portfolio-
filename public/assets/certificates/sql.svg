<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="100%" height="100%">
  <defs>
    <linearGradient id="certBgSql" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050E1A"/>
      <stop offset="50%" stop-color="#0B1C33"/>
      <stop offset="100%" stop-color="#040913"/>
    </linearGradient>
    <linearGradient id="blueGlowSql" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="certShadowSql" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="540" fill="url(#certBgSql)"/>

  <!-- Outer Glass Frame -->
  <rect x="25" y="25" width="750" height="490" rx="16" fill="#091424" stroke="#1E3A5F" stroke-width="2" filter="url(#certShadowSql)"/>
  
  <!-- Inner Border with Decorative Corners -->
  <rect x="45" y="45" width="710" height="450" rx="10" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Corner Tech Accent Brackets -->
  <path d="M 45 75 L 45 45 L 75 45" stroke="#22C55E" stroke-width="3" fill="none"/>
  <path d="M 725 45 L 755 45 L 755 75" stroke="#22C55E" stroke-width="3" fill="none"/>
  <path d="M 45 465 L 45 495 L 75 495" stroke="#22C55E" stroke-width="3" fill="none"/>
  <path d="M 725 495 L 755 495 L 755 465" stroke="#22C55E" stroke-width="3" fill="none"/>

  <!-- Top HackerRank Style Hex Badge -->
  <rect x="310" y="32" width="180" height="26" rx="13" fill="#0A1E14" stroke="#22C55E" stroke-width="1"/>
  <text x="400" y="49" fill="#4ADE80" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">★ HACKERRANK VERIFIED ★</text>

  <!-- Issuer Header -->
  <text x="400" y="105" fill="#22C55E" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="bold" letter-spacing="4" text-anchor="middle">HACKERRANK CERTIFICATION</text>
  
  <text x="400" y="145" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12" letter-spacing="4" text-anchor="middle">CERTIFICATE OF COMPETENCY</text>
  
  <text x="400" y="180" fill="#64748B" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">THIS ACKNOWLEDGES THAT</text>
  
  <!-- Candidate Name -->
  <text x="400" y="235" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="34" font-weight="900" letter-spacing="1" text-anchor="middle">PRAVEEN R</text>
  <line x1="260" y1="255" x2="540" y2="255" stroke="url(#blueGlowSql)" stroke-width="2"/>

  <!-- Subject / Description -->
  <text x="400" y="290" fill="#CBD5E1" font-family="Inter, sans-serif" font-size="15" text-anchor="middle">Has successfully passed the assessment in</text>
  
  <text x="400" y="330" fill="url(#blueGlowSql)" font-family="Inter, sans-serif" font-size="24" font-weight="800" text-anchor="middle">SQL (STRUCTURED QUERY LANGUAGE)</text>
  
  <text x="400" y="365" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">Demonstrating skills in Relational Queries, Multi-table Joins, and Data Analysis</text>

  <!-- Bottom Seals & Signatures -->
  <g transform="translate(100, 400)">
    <!-- Left Seal: Verified Code -->
    <rect x="0" y="0" width="180" height="55" rx="8" fill="#050E1A" stroke="#1E3A5F" stroke-width="1"/>
    <text x="90" y="24" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">ASSESSMENT ID</text>
    <text x="90" y="42" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">HACKERRANK-SQL-VERIFIED</text>
  </g>

  <!-- Center Hexagon Badge -->
  <g transform="translate(365, 395)">
    <circle cx="35" cy="35" r="32" fill="#091424" stroke="#22C55E" stroke-width="2"/>
    <circle cx="35" cy="35" r="26" fill="#0A2218" stroke="#15803D" stroke-width="1"/>
    <text x="35" y="41" fill="#4ADE80" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" text-anchor="middle">SQL</text>
  </g>

  <g transform="translate(520, 400)">
    <!-- Right Seal: Domain -->
    <rect x="0" y="0" width="180" height="55" rx="8" fill="#050E1A" stroke="#1E3A5F" stroke-width="1"/>
    <text x="90" y="24" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">ASSESSMENT STATUS</text>
    <text x="90" y="42" fill="#22C55E" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">● PASSED &amp; CERTIFIED</text>
  </g>
</svg>
